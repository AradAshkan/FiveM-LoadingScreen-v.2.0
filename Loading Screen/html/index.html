<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arad Ashkan | FiveM Loading</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Michroma&display=swap" rel="stylesheet">
</head>
<body>
    <div id="cursor-glow"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="container">
        <div class="logo-container">
            <h1 class="glitch" data-text="CYBERCORE">CYBERCORE</h1>
            <div class="tagline">PREMIUM ROLEPLAY EXPERIENCE</div>
        </div>

        <div class="info-grid">
            <div class="glass-box">
                <span class="box-label">SYSTEM STATUS</span>
                <div class="status-item">NETWORK: <span>STABLE</span></div>
                <div class="status-item">VERSION: <span>3.0.1</span></div>
            </div>
            <div class="glass-box">
                <span class="box-label">COMMUNITY</span>
                <p>discord.gg/yourserver</p>
            </div>
        </div>

        <div class="footer-ui">
            <div class="loading-info">
                <div class="shimmer" id="status-text">SYNCHRONIZING ASSETS...</div>
                <div id="percent">0%</div>
            </div>
            <div class="progress-track">
                <div id="progress-bar">
                    <div class="energy-flow"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
